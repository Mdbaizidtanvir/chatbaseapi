<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi File Upload Test</title>
</head>
<body>
    <h1>Multi File Upload</h1>

    <form id="uploadForm">
        <input type="text" name="user_id" placeholder="User ID" required><br><br>
        <input type="text" name="bot_id" placeholder="Bot ID" required><br><br>
        <input type="file" name="files" multiple required><br><br>
        <button type="submit">Upload</button>
    </form>

    <h2>Response:</h2>
    <pre id="responseOutput"></pre>

    <script>
        const form = document.getElementById('uploadForm');
        const output = document.getElementById('responseOutput');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // prevent normal GET form submit

            const formData = new FormData(form);

            try {
                const res = await fetch('/upload/', { // trailing slash important
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const text = await res.text(); 
                    output.textContent = 'Error: ' + text;
                    return;
                }

                const data = await res.json();
                output.textContent = JSON.stringify(data, null, 2);

            } catch (err) {
                output.textContent = 'Error: ' + err;
            }
        });
    </script>
</body>
</html>
